name: flutter_attendance_app
description: "نظام متابعة الحضور والمهام وإدارة الأحداث والـ Overload لأسرة الأنبا أرسانيوس والقديس نيقولاوس لوسائل الإيضاح"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.1
  fl_chart: ^0.66.0
  pdf: ^3.10.7
  printing: ^5.12.0
  csv: ^6.0.0
  url_launcher: ^6.2.4
  uuid: ^4.3.3
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
